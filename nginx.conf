server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- PASSERELLE SÉCURISÉE XENTRIPAY ---
    location /api/xentripay/ {
        # Redirige la requête vers le serveur cible XentriPAY
        proxy_pass https://test.xentripay.com/api/;

        # Configuration SSL essentielle pour les requêtes HTTPS sortantes
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # En-têtes standards pour préserver les métadonnées de la requête
        proxy_set_header Host test.xentripay.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Injection automatique et sécurisée de ta clé d'API
        # (Invisible depuis le navigateur de l'utilisateur)
        proxy_set_header X-XENTRIPAY-KEY "1840404869284f6d9108e5b0fe3f037a";
    }
}